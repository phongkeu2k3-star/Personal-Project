<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Finance Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <div class="auth-card glass-card p-4">
        <h3 class="text-center text-success fw-bold mb-4">TẠO TÀI KHOẢN</h3>

        <div class="mb-3">
            <label class="text-muted small">Email</label>
            <input type="email" id="reg-email" class="form-control bg-dark text-light border-secondary">
        </div>

        <div class="mb-3">
            <label class="text-muted small">Mật khẩu</label>
            <input type="password" id="reg-password" class="form-control bg-dark text-light border-secondary">
        </div>

        <div class="mb-4">
            <label class="text-muted small">Xác nhận mật khẩu</label>
            <input type="password" id="reg-confirm" class="form-control bg-dark text-light border-secondary">
        </div>

        <button onclick="register()" class="btn btn-success w-100 fw-bold py-2 mb-3">ĐĂNG KÝ</button>

        <div class="text-center">
            <small class="text-muted">Đã có tài khoản?</small>
            <a href="login.html" class="text-warning text-decoration-none fw-bold">Đăng nhập</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
