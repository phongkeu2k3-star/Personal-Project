<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-black border-bottom border-secondary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold text-warning">
                <i class="fa-solid fa-chart-line me-2"></i>FINANCE
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card p-4">
            <label class="text-muted small mb-2">Tìm kiếm và thêm coin vào danh sách theo dõi:</label>
            <div class="input-group">
                <input type="text"
                       id="coinInput"
                       class="form-control bg-dark text-light border-secondary"
                       list="coinList"
                       placeholder="Gõ tên coin để tìm (VD: Bitcoin, ETH...)"
                       autocomplete="off">

                <datalist id="coinList"></datalist>

                <button class="btn btn-warning fw-bold" onclick="createAsset()">
                    <i class="fa-solid fa-plus me-1"></i> Thêm Coin
                </button>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="glass-card p-0 overflow-hidden">
                    <div class="p-3 border-bottom border-secondary bg-dark bg-opacity-50">
                        <h5 class="m-0 fw-bold"><i class="fa-solid fa-list me-2"></i>Thị trường</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark-custom mb-0">
                            <thead>
                                <tr class="text-secondary text-uppercase small">
                                    <th class="ps-4">Tài sản</th>
                                    <th>Giá (USDT)</th>
                                    <th>Cập nhật</th>
                                    <th class="text-end pe-4">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="assetTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="glass-card p-3 h-100">
                    <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-area me-2"></i>Biểu đồ</h5>
                    <canvas id="priceChart"></canvas>
                    <div id="chartPlaceholder" class="text-center text-muted mt-5">
                        <small>Chọn một coin để xem chi tiết</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
